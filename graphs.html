{% extends "base.html" %}{% block title %}Graphs & Analysis{% endblock %}{% block content %}
<div class="page-head"><div><h1>▥ Graphs & Analysis</h1><p>Choose exactly what you want to compare, then generate the graph.</p></div></div>
<section class="card filters"><div><label>X-Axis<select id="gx"><option value="temperature">Temperature (°C)</option><option value="scba">SCBA Replacement (%)</option></select></label><label>Y-Axis<select id="gy"><option value="residual">Residual Compressive Strength (%)</option><option value="strength">Residual Compressive Strength (MPa)</option><option value="mass">Mass Loss (%)</option></select></label><label>Group By<select id="gg"><option value="mix">Mix ID</option><option value="temperature">Temperature</option></select></label><button class="primary" onclick="makeGraph()">▥ Generate Graph</button></div></section>
<section class="chart-grid"><div class="card chart-card"><div class="card-title"><h2 id="chartTitle">Residual Compressive Strength vs Temperature</h2><button class="secondary" onclick="downloadChart()">⇩ Download</button></div><canvas id="mainChart"></canvas></div><div class="card"><h2>Suggested Analysis</h2><div class="suggestions"><button onclick="preset('temperature','residual','mix')">Residual Strength vs Temperature</button><button onclick="preset('scba','residual','temperature')">Residual Strength vs SCBA</button><button onclick="preset('temperature','mass','mix')">Mass Loss vs Temperature</button><button onclick="preset('temperature','strength','mix')">Strength (MPa) vs Temperature</button></div></div></section>
{% endblock %}
